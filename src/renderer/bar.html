<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
  <title>Capri</title>
  <link rel="stylesheet" href="styles/capri.css">
</head>
<body class="bar">
  <form class="bar__form" autocomplete="off">
    <input class="bar__input" type="text" maxlength="500" spellcheck="false" aria-label="Capri">
    <button class="bar__send" type="submit"></button>
    <button class="bar__close" type="button" aria-label="✕">✕</button>
  </form>
  <script type="module" src="js/bar.js"></script>
</body>
</html>
